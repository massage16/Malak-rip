<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Spa Booking Algeria</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family: Arial;
background:url("https://images.unsplash.com/photo-1544161515-4ab6ce6db874") center/cover fixed;
color:white;
}

.overlay{
background:rgba(0,0,0,0.75);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
}

.card{
width:100%;
max-width:460px;
background:rgba(20,20,20,0.92);
backdrop-filter: blur(12px);
border-radius:18px;
padding:20px;
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h2{
text-align:center;
color:#00f5c6;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#1f1f1f;
color:white;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00c9a7,#00f5c6);
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.85;
}

.hidden{display:none;}

#success{
text-align:center;
line-height:1.6;
}

.badge{
background:#00f5c6;
color:black;
padding:6px 10px;
border-radius:8px;
display:inline-block;
margin-top:10px;
font-weight:bold;
}

.copyBox{
background:#111;
padding:10px;
border-radius:10px;
text-align:center;
margin-top:10px;
}

small{opacity:0.8;}

</style>
</head>

<body>

<div class="overlay">

<div class="card">

<!-- 🟢 STEP 1 -->
<div id="step1">

<h2>💆‍♀️ حجز جلسة مساج</h2>

<input id="name" placeholder="الاسم الكامل">
<input id="phone" placeholder="رقم الهاتف">

<select id="wilaya">
<option value="">اختر الولاية</option>

<option>أدرار</option><option>الشلف</option><option>الأغواط</option>
<option>أم البواقي</option><option>باتنة</option><option>بجاية</option>
<option>بسكرة</option><option>بشار</option><option>البليدة</option>
<option>البويرة</option><option>تمنراست</option><option>تبسة</option>
<option>تلمسان</option><option>تيارت</option><option>الجزائر</option>
<option>الجلفة</option><option>سطيف</option><option>عنابة</option>
<option>قسنطينة</option><option>وهران</option><option>ورقلة</option>

</select>

<select id="service">
<option value="">اختر الخدمة</option>
<option value="VIP - 12000 دج">💎 VIP - 12000 دج</option>
<option value="عادية - 7000 دج">✨ عادية - 7000 دج</option>
</select>

<button onclick="goStep2()">متابعة الدفع</button>

</div>

<!-- 🟡 STEP 2 -->
<div id="step2" class="hidden">

<h2>💳 الدفع الآمن</h2>

<p>📲 حول إلى الرقم:</p>

<div class="copyBox">

<h3 id="payNumber">00799999004286372491</h3>

<button onclick="copyNumber()">📋 نسخ رقم الدفع</button>

</div>

<p>📌 رقم الطلب:</p>
<h3 id="orderId"></h3>

<p>📄 رفع وصل الدفع:</p>
<input type="file" id="receipt">

<button onclick="confirmPayment()">✅ تأكيد الدفع</button>

</div>

<!-- 🟢 SUCCESS -->
<div id="step3" class="hidden">

<h2>🎉 تم الحجز بنجاح</h2>

<div id="success"></div>

<button onclick="location.reload()">حجز جديد</button>

</div>

</div>

</div>

<script>

let orderId = "SPA-" + Math.floor(Math.random()*999999);

/* الانتقال */
function goStep2(){

if(
document.getElementById("name").value=="" ||
document.getElementById("phone").value=="" ||
document.getElementById("wilaya").value=="" ||
document.getElementById("service").value==""
){
alert("املأ جميع المعلومات");
return;
}

document.getElementById("step1").style.display="none";
document.getElementById("step2").style.display="block";

document.getElementById("orderId").innerText = orderId;
}

/* نسخ رقم الدفع */
function copyNumber(){
let num = document.getElementById("payNumber").innerText;
navigator.clipboard.writeText(num);
alert("📋 تم نسخ رقم الدفع");
}

/* تأكيد الدفع */
function confirmPayment(){

if(document.getElementById("receipt").files.length === 0){
alert("يجب رفع وصل الدفع");
return;
}

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let service = document.getElementById("service").value;
let wilaya = document.getElementById("wilaya").value;

document.getElementById("step2").style.display="none";
document.getElementById("step3").style.display="block";

document.getElementById("success").innerHTML = `
<div class="badge">رقم الطلب: ${orderId}</div>
<p>👤 الاسم: ${name}</p>
<p>📞 الهاتف: ${phone}</p>
<p>📍 الولاية: ${wilaya}</p>
<p>💎 الخدمة: ${service}</p>
<p>📄 تم استلام وصل الدفع بنجاح</p>
`;

}

</script>

</body>
</html>
