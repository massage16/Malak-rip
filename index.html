<!-- ======================================================
FULL PROFESSIONAL COMMERCIAL PLATFORM (FINAL READY VERSION)
Firebase + Auth + Firestore + Telegram + All Wilayas Algeria
====================================================== --><!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منصة الحجز الاحترافية</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>

<body><div class="container"><h2>🏢 منصة الحجز التجارية</h2><!-- LOGIN --><div id="loginBox">

<input id="password" type="password" placeholder="كلمة المرور">
<button class="primary" onclick="login()">دخول</button>
</div><!-- APP --><div id="app" class="hidden"><button class="logout" onclick="logout()">تسجيل خروج</button>

<h3>📦 إنشاء طلب جديد</h3><input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف"><select id="wilaya">
<option>اختر الولاية</option>

<option>14 - تيارت</option>
<option>15 - تيزي وزو</option>
<option>16 - الجزائر</option>
<option>17 - الجلفة</option>
<option>18 - جيجل</option>
<option>19 - سطيف</option>

<option>21 - سكيكدة</option>

<option>25 - قسنطينة</option>
<option>26 - المدية</option>
<option>27 - مستغانم</option>

<option>29 - معسكر</option>
<option>30 - ورقلة</option>

<option>40 - خنشلة</option>
<option>41 - سوق أهراس</option>
<option>42 - تيبازة</option>

</select><button class="primary" onclick="addOrder()">إرسال الطلب</button>

<hr><h3>📊 لوحة التحكم (Admin)</h3>
<div id="orders"></div></div>
</div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 ضع بيانات Firebase هنا
const firebaseConfig = {
  apiKey: "AIzaSyDUDy9umf4D6w3qa5tOVXprjF5YUlzMTAo",
  authDomain: "malak-massag.firebaseapp.com",
  projectId: "malak-massag",
  storageBucket: "malak-massag.firebasestorage.app",
  messagingSenderId: "406024451351",
  appId: "1:406024451351:web:39de79981586c3bc40b352"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ordersRef = collection(db,"orders");

let token = "YOUR_BOT_TOKEN";
let chat_id = "YOUR_CHAT_ID";

// LOGIN
window.login = function(){
let email = document.getElementById("email").value;
let password = document.getElementById("password").value;
signInWithEmailAndPassword(auth,email,password)
.catch(e=>alert(e.message));
}

window.logout = function(){ signOut(auth); }

onAuthStateChanged(auth,(user)=>{
if(user){
loginBox.style.display="none";
appUI.style.display="block";
loadOrders();
}else{
loginBox.style.display="block";
appUI.style.display="none";
}
});

// ADD ORDER
window.addOrder = async function(){
let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let wilaya = document.getElementById("wilaya").value;

await addDoc(ordersRef,{name,phone,wilaya,status:"pending",time:Date.now()});

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id,text:`📦 طلب جديد\n👤 ${name}\n📞 ${phone}\n📍 ${wilaya}`})
});
}

// LOAD ORDERS
function loadOrders(){
onSnapshot(ordersRef,(snap)=>{
let box=document.getElementById("orders");
box.innerHTML="";

snap.forEach((d)=>{
let o=d.data();
box.innerHTML+=`
<div class="card">
<b>${o.name}</b><br>
📞 ${o.phone}<br>
📍 ${o.wilaya}<br>
<div class="status">الحالة: ${o.status}</div>

<button class="accept" onclick="acceptOrder('${d.id}')">قبول</button>
<button class="reject" onclick="rejectOrder('${d.id}')">رفض</button>
</div>
`;
});
});
}

window.acceptOrder=async function(id){
await updateDoc(doc(db,"orders",id),{status:"accepted"});
}

window.rejectOrder=async function(id){
await updateDoc(doc(db,"orders",id),{status:"rejected"});
}

</script></body>
