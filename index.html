<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حجز خدمات مساج</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family: Arial;
background:url("https://images.unsplash.com/photo-1544161515-4ab6ce6db874") center/cover fixed;
color:white;
}

.overlay{
background:rgba(0,0,0,0.75);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
}

.card{
width:100%;
max-width:450px;
background:rgba(20,20,20,0.92);
backdrop-filter: blur(12px);
border-radius:18px;
padding:20px;
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h2{
text-align:center;
color:#00f5c6;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#1f1f1f;
color:white;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00c9a7,#00f5c6);
color:black;
font-weight:bold;
cursor:pointer;
}

.hidden{display:none;}

#success{
text-align:center;
line-height:1.6;
}

.badge{
background:#00f5c6;
color:black;
padding:6px 10px;
border-radius:8px;
display:inline-block;
margin-top:10px;
font-weight:bold;
}

.copy{
background:#111;
padding:10px;
border-radius:10px;
text-align:center;
margin-top:10px;
}

</style>
</head>

<body>

<div class="overlay">

<div class="card">

<!-- 🟢 STEP 1 -->
<div id="step1">

<h2>💆‍♀️ حجز مساج</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="الهاتف">

<select id="wilaya">
<option value="">اختر الولاية</option>
<option>وهران</option>
<option>الجزائر</option>
<option>قسنطينة</option>
<option>عنابة</option>
<option>سطيف</option>
</select>

<select id="service">
<option value="">اختر الخدمة</option>
<option value="VIP - 12000">VIP - 12000 دج</option>
<option value="عادية - 7000">عادية - 7000 دج</option>
</select>

<button onclick="next()">متابعة</button>

</div>

<!-- 🟡 STEP 2 -->
<div id="step2" class="hidden">

<h2>💳 الدفع</h2>

<p>حوّل إلى:</p>
<h3>00799999004286372491</h3>

<div class="copy">
<button onclick="copyNumber()">📋 نسخ رقم الدفع</button>
</div>

<p>رقم الطلب:</p>
<h3 id="orderId"></h3>

<input type="file" id="receipt">

<button onclick="send()">إرسال الطلب</button>

</div>

<!-- 🟢 SUCCESS -->
<div id="step3" class="hidden">

<h2>✅ تم تأكيد الطلب</h2>

<div id="success"></div>

<button onclick="location.reload()">حجز جديد</button>

</div>

</div>

</div>

<script>

let orderId = "ORD-" + Math.floor(Math.random()*999999);

/* step 1 */
function next(){

if(
document.getElementById("name").value=="" ||
document.getElementById("phone").value=="" ||
document.getElementById("service").value=="" ||
document.getElementById("wilaya").value==""
){
alert("املأ جميع المعلومات");
return;
}

document.getElementById("step1").style.display="none";
document.getElementById("step2").style.display="block";

document.getElementById("orderId").innerText = orderId;
}

/* نسخ */
function copyNumber(){
navigator.clipboard.writeText("00799999004286372491");
alert("تم النسخ");
}

/* إرسال Telegram */
function send(){

if(document.getElementById("receipt").files.length===0){
alert("ارفع وصل الدفع");
return;
}

let token = "8746466394:AAGypQv2KmLBYmlRYkO_hsFWiY7_REGFWHE";
let chat_id = "8735699172";

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let service = document.getElementById("service").value;
let wilaya = document.getElementById("wilaya").value;

let text =
"💆‍♀️ طلب جديد\n" +
"رقم: " + orderId + "\n" +
"الاسم: " + name + "\n" +
"الهاتف: " + phone + "\n" +
"الولاية: " + wilaya + "\n" +
"الخدمة: " + service;

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({
chat_id: chat_id,
text: text
})
});

/* success page */
document.getElementById("step2").style.display="none";
document.getElementById("step3").style.display="block";

document.getElementById("success").innerHTML =
"<div class='badge'>رقم الطلب: "+orderId+"</div><br>تم استلام الطلب بنجاح";

}

</script>

</body>
  </html>
