<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حجز خدمات مساج</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family: Arial;
margin:0;
background:#111;
color:white;
}

.box{
max-width:420px;
margin:auto;
margin-top:40px;
background:#222;
padding:15px;
border-radius:10px;
}

input,select,button{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:none;
}

button{
background:green;
color:white;
font-weight:bold;
cursor:pointer;
}

a{
text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<h2>حجز خدمات مساج</h2>

<input id="name" placeholder="الاسم">
<input id="lastname" placeholder="اللقب">
<input id="phone" placeholder="رقم الهاتف">

<select id="wilaya">
<option>اختر الولاية</option>
<option>وهران</option>
<option>الجزائر</option>
<option>قسنطينة</option>
<option>عنابة</option>
<option>بجاية</option>
<option>سطيف</option>
<option>تلمسان</option>
<option>البليدة</option>
<option>بسكرة</option>
<option>سطيف</option>
</select>

<select id="service">
<option value="">اختر الخدمة</option>
<option value="VIP - 12000 دج">VIP - 12000 دج</option>
<option value="عادية - 7000 دج">عادية - 7000 دج</option>
</select>

<button onclick="send()">إرسال الطلب</button>

<p id="msg"></p>

<!-- 💬 زر تلغرام -->
<a href="https://t.me/NXL_97" target="_blank"
style="display:block;margin-top:15px;
text-align:center;background:#0088cc;
color:white;padding:10px;border-radius:6px;
font-weight:bold;">
💬 تواصل عبر تلغرام
</a>

</div>

<script>

let orderId = "ORD-" + Math.floor(Math.random()*999999);

/* إرسال الطلب */
function send(){

let name = document.getElementById("name").value;
let lastname = document.getElementById("lastname").value;
let phone = document.getElementById("phone").value;
let wilaya = document.getElementById("wilaya").value;
let service = document.getElementById("service").value;

if(!service){
alert("اختر الخدمة");
return;
}

/* إرسال للسيرفر */
fetch("https://YOUR-SERVER-LINK/send",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify({
name,
lastname,
phone,
wilaya,
service,
orderId
})
})
.then(()=>{

document.getElementById("msg").innerText =
"✅ تم إرسال الطلب رقم: " + orderId;

});

}

</script>

</body>
</html>
