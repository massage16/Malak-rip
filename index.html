<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>خدمات الحجز</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Arial;
background:#111;
color:white;
display:flex;
justify-content:center;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#1c1c1c;
padding:20px;
border-radius:10px;
}

input, select, button{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:6px;
}

button{
background:green;
color:white;
font-size:16px;
cursor:pointer;
}

h2{text-align:center;}
</style>
</head>

<body>

<div class="container">

<h2>نموذج الحجز</h2>

<input id="name" placeholder="الاسم واللقب">
<input id="phone" placeholder="رقم الهاتف">

<select id="wilaya">
<option>اختر الولاية</option>
<option>أدرار</option><option>الشلف</option><option>الأغواط</option>
<option>أم البواقي</option><option>باتنة</option><option>بجاية</option>
<option>بسكرة</option><option>بشار</option><option>البليدة</option>
<option>البويرة</option><option>تمنراست</option><option>تبسة</option>
<option>تلمسان</option><option>تيارت</option><option>تيزي وزو</option>
<option>الجزائر</option><option>الجلفة</option><option>جيجل</option>
<option>سطيف</option><option>سعيدة</option><option>سكيكدة</option>
<option>سيدي بلعباس</option><option>عنابة</option><option>قالمة</option>
<option>قسنطينة</option><option>المدية</option><option>مستغانم</option>
<option>المسيلة</option><option>معسكر</option><option>ورقلة</option>
<option>وهران</option><option>البيض</option><option>إليزي</option>
<option>برج بوعريريج</option><option>بومرداس</option><option>الطارف</option>
<option>تندوف</option><option>تيسمسيلت</option><option>الوادي</option>
<option>خنشلة</option><option>سوق أهراس</option><option>تيبازة</option>
<option>ميلة</option><option>عين الدفلى</option><option>النعامة</option>
<option>عين تموشنت</option><option>غرداية</option><option>غليزان</option>
</select>

<select id="service">
<option value="7000">عادية - 7000 دج</option>
<option value="12000">خاصة - 12000 دج</option>
<option value="15000">VIP - 15000 دج</option>
</select>

<input type="file" id="proof">

<button onclick="sendData()">إرسال الحجز</button>

</div>

<script>
let token = "8746466394:AAGypQv2KmLBYmlRYkO_hsFWiY7_REGFWHE";
let chat_id = "8735699172";

function sendData(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let wilaya = document.getElementById("wilaya").value;
let service = document.getElementById("service").value;
let file = document.getElementById("proof").files[0];

let text =
"📌 طلب حجز جديد\n" +
"👤 الاسم: " + name + "\n" +
"📞 الهاتف: " + phone + "\n" +
"📍 الولاية: " + wilaya + "\n" +
"💰 الخدمة: " + service + " دج";

fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify({
chat_id: chat_id,
text: text
})
});

if(file){
let formData = new FormData();
formData.append("chat_id", chat_id);
formData.append("photo", file);

fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
method: "POST",
body: formData
});
}

alert("تم إرسال الطلب");
}
</script>

</body>
  </html>
