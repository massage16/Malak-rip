<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حجز خدمات مساج</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family: Arial;
margin:0;
background:#111;
color:white;
}

.box{
max-width:420px;
margin:auto;
margin-top:40px;
background:#222;
padding:15px;
border-radius:10px;
}

input,select,button{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:none;
}

button{
background:green;
color:white;
font-weight:bold;
cursor:pointer;
}

.hidden{display:none;}

#msg{
margin-top:10px;
color:#00ff90;
font-weight:bold;
line-height:1.6;
}
</style>
</head>

<body>

<div class="box">

<!-- 🟢 المرحلة 1 -->
<div id="step1">

<h2>حجز خدمات مساج</h2>

<input id="name" placeholder="الاسم">
<input id="lastname" placeholder="اللقب">
<input id="phone" placeholder="رقم الهاتف">

<select id="wilaya">
<option>اختر الولاية</option>
<option>وهران</option>
<option>الجزائر</option>
<option>قسنطينة</option>
<option>عنابة</option>
<option>بجاية</option>
<option>سطيف</option>
<option>تلمسان</option>
</select>

<select id="service">
<option value="">اختر الخدمة</option>
<option value="VIP - 12000 دج">VIP - 12000 دج</option>
<option value="عادية - 7000 دج">عادية - 7000 دج</option>
</select>

<button onclick="goStep2()">تأكيد</button>

</div>

<!-- 🟡 المرحلة 2 -->
<div id="step2" class="hidden">

<h2>الدفع</h2>

<p>حوّل إلى الرقم:</p>
<h3>00799999004286372491</h3>

<p>رقم الطلب:</p>
<h3 id="orderIdShow"></h3>

<input type="file" id="receipt">

<button onclick="send()">📩 إرسال وصل الدفع</button>

<button onclick="back()">🔙 رجوع</button>

<div id="msg"></div>

</div>

<!-- 💬 تلغرام -->
<a href="https://t.me/NXL_97" target="_blank"
style="display:block;margin-top:15px;
text-align:center;background:#0088cc;
color:white;padding:10px;border-radius:6px;
font-weight:bold;">
💬 تواصل عبر تلغرام
</a>

</div>

<script>

let orderId = "ORD-" + Math.floor(Math.random()*999999);

/* 🔵 الانتقال للصفحة الثانية */
function goStep2(){

let service = document.getElementById("service").value;

if(service === ""){
alert("اختر الخدمة");
return;
}

document.getElementById("step1").style.display = "none";
document.getElementById("step2").style.display = "block";

document.getElementById("orderIdShow").innerText = orderId;
}

/* 🔙 رجوع */
function back(){
document.getElementById("step1").style.display = "block";
document.getElementById("step2").style.display = "none";
}

/* 📩 إرسال الطلب + رسالة تأكيد */
function send(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let service = document.getElementById("service").value;

if(name === "" || phone === ""){
alert("املأ المعلومات");
return;
}

/* رسالة التأكيد */
document.getElementById("msg").innerHTML =
"✅ تم تأكيد الطلب<br>" +
"📌 رقم الطلب: <b>" + orderId + "</b><br>" +
"💎 الخدمة: " + service + "<br>" +
"📨 تم استلام الطلب بنجاح";

}

</script>

</body>
</html>
