<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خدمات مساج VIP</title>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

.hero{
height:260px;
background:url('https://images.unsplash.com/photo-1544161515-4ab6ce6db874?q=80&w=1200') center/cover;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.hero::after{
content:'';
position:absolute;
inset:0;
background:rgba(0,0,0,0.55);
}

.hero h1{
position:relative;
z-index:2;
font-size:36px;
}

.gallery{
display:flex;
gap:10px;
overflow:auto;
padding:15px;
}

.gallery img{
width:220px;
height:140px;
object-fit:cover;
border-radius:14px;
flex-shrink:0;
}

.stats{
display:flex;
justify-content:space-around;
margin:10px;
padding:15px;
background:#1c1c1c;
border-radius:15px;
}

.stat-box{
text-align:center;
}

.stat-box h2{
margin:0;
font-size:28px;
color:#00ff99;
}

.container{
max-width:430px;
margin:20px auto;
padding:20px;
background:#1a1a1a;
border-radius:20px;
}

input,select{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:#2b2b2b;
color:white;
font-size:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:18px;
border:none;
border-radius:12px;
background:#00cc66;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00aa55;
}

.notice{
margin-top:15px;
padding:12px;
background:#003d1f;
border-radius:12px;
color:#8cffc1;
text-align:center;
font-size:14px;
}

.price{
background:#222;
padding:12px;
border-radius:12px;
margin-top:15px;
text-align:center;
font-size:18px;
color:#00ff99;
}
