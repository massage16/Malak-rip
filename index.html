<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Luxury Massage Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family: Arial;
background:url("https://images.unsplash.com/photo-1544161515-4ab6ce6db874") center/cover fixed;
color:white;
}

.overlay{
background:rgba(0,0,0,0.75);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:450px;
background:rgba(20,20,20,0.9);
backdrop-filter: blur(10px);
border-radius:15px;
padding:20px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

h2{
text-align:center;
color:#00e6b8;
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
font-size:14px;
}

button{
background:#00c48c;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#00a878;
}

.hidden{display:none;}

.service-images{
display:flex;
gap:10px;
margin-top:10px;
}

.service-images img{
width:100%;
border-radius:10px;
height:80px;
object-fit:cover;
}

#receiptBox{
background:#111;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.small{
font-size:13px;
opacity:0.8;
}

</style>
</head>

<body>

<div class="overlay">

<div class="card">

<!-- 🟢 STEP 1 -->
<div id="step1">

<h2>💆‍♀️ حجز جلسة مساج</h2>

<div class="service-images">
<img src="https://images.unsplash.com/photo-1515377905703-c4788e51af15">
<img src="https://images.unsplash.com/photo-1540555700478-4be289fbecef">
<img src="https://images.unsplash.com/photo-1519823551278-64ac92734fb1">
</div>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">

<select id="wilaya">
<option>اختر الولاية</option>
<option>وهران</option>
<option>الجزائر</option>
<option>قسنطينة</option>
<option>عنابة</option>
</select>

<select id="service">
<option value="">اختر الخدمة</option>
<option value="VIP - 12000 دج">VIP - 12000 دج</option>
<option value="عادية - 7000 دج">عادية - 7000 دج</option>
</select>

<button onclick="goStep2()">متابعة الدفع</button>

</div>

<!-- 🟡 STEP 2 -->
<div id="step2" class="hidden">

<h2>💳 الدفع</h2>

<p class="small">حوّل إلى:</p>
<h3>00799999004286372491</h3>

<p>رقم العملية:</p>
<h3 id="orderIdShow"></h3>

<div id="receiptBox">
<p>📄 بعد الدفع سيتم إنشاء إيصال تلقائي</p>
</div>

<button onclick="generateReceipt()">تأكيد الدفع وإنشاء إيصال</button>

<button onclick="back()">رجوع</button>

<div id="msg"></div>

</div>

</div>

</div>

<script>

let orderId = "MS-" + Math.floor(Math.random()*999999);

/* الانتقال */
function goStep2(){

if(document.getElementById("service").value === ""){
alert("اختر الخدمة");
return;
}

document.getElementById("step1").style.display="none";
document.getElementById("step2").style.display="block";

document.getElementById("orderIdShow").innerText = orderId;
}

/* رجوع */
function back(){
document.getElementById("step1").style.display="block";
document.getElementById("step2").style.display="none";
}

/* إنشاء إيصال */
function generateReceipt(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let service = document.getElementById("service").value;

let content =
`🧾 إيصال دفع
------------------
رقم العملية: ${orderId}
الاسم: ${name}
الهاتف: ${phone}
الخدمة: ${service}
------------------
تم تأكيد الحجز`;

document.getElementById("msg").innerHTML =
"✅ تم تأكيد الدفع<br><pre>" + content + "</pre>";

// تحميل كملف txt
let blob = new Blob([content], {type:"text/plain"});
let link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.download = orderId + ".txt";
link.click();

}

</script>

</body>
</html>
